spring.application.name=ecommerce-platform
server.port=8080

# In-Memory H2 Database Configuration (Default / Zero-Config Development)
spring.datasource.url=jdbc:h2:mem:ecommerce_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/

# JWT Configuration
app.jwt.secret=EcommerceUltraSecureSecretKeyForSigningJwtTokensWithHmacSha256Algorithm32Bytes!
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.ecommerce=INFO
logging.level.org.springframework.security=WARN
